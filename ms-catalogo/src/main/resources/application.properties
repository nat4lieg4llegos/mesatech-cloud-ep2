spring.application.name=ms-catalogo
server.port=${SERVER_PORT:8081}

# ===== RDS Catálogo (instancia EXCLUSIVA de este microservicio) =====
# Los valores reales van en variables de entorno (archivo .env en la EC2 A, nunca en Git)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:catalogo}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== RabbitMQ (EC2 C, por IP PRIVADA: no cambia al reiniciar el Learner Lab) =====
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones del broker + retorno de mensajes sin cola
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

app.rabbitmq.exchange=${RABBIT_EXCHANGE:catalogo.exchange}
app.rabbitmq.routing-key=${RABBIT_ROUTING_KEY:categoria.creada}
