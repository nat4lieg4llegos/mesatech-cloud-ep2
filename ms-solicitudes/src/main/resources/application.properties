spring.application.name=ms-solicitudes
server.port=${SERVER_PORT:8082}

# ===== RDS Solicitudes (instancia EXCLUSIVA, distinta de la de Catálogo) =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:solicitudes}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== RabbitMQ (EC2 C, IP privada) =====
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s

# Un mensaje a la vez; ACK automático SOLO cuando el listener termina bien (después de guardar en RDS)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# Si falla el guardado (ej: RDS caída) el mensaje vuelve a la cola
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# Si la cola no existe al arrancar, falla el inicio en vez de quedar "levantado" sin consumir
spring.rabbitmq.listener.simple.missing-queues-fatal=true

app.rabbitmq.queue=${RABBIT_QUEUE:solicitudes.catalogo.queue}
